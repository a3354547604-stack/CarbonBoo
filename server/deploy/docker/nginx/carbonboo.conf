# ============================================================================
# CarbonBoo · nginx 站点（容器版：纯 HTTP，无 TLS）
#
#   与 deploy/nginx/carbonboo.conf（宿主机版）的差别只有三处：
#     ① upstream 从 127.0.0.1:8000 改为 compose 服务名 server:8000；
#     ② 没有 443 / 证书段（本机暂无域名，ADR-0001 未决项④）；有域名后按 README §4 加。
#     ③ server_name 用 _（任意 Host），否则用 IP 直接访问会被 nginx 丢给默认站点。
#
# 口径（AGENTS §6）：公网只开 SSH/80/443；后端不对外；/admin 需强口令 + 登录限流；
#                   /docs 关闭由应用侧 DOCS_ENABLED 控制，nginx 不重复实现。
# ============================================================================

# 登录类接口（账号 + 管理端）：每 IP 每分钟 20 次，突发 10
limit_req_zone $binary_remote_addr zone=carbonboo_login:10m rate=20r/m;

upstream carbonboo_api {
    server server:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 同步 push 是全量快照（云端备份 since=0），放宽到 8m
    client_max_body_size 8m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/carbonboo.access.log;
    error_log  /var/log/nginx/carbonboo.error.log warn;

    # ---------- 探活（不带业务，供负载/监控） ----------
    location = /api/v1/health {
        proxy_pass http://carbonboo_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 取价 / 配置下发：免令牌，可公开缓存 5 分钟 ----------
    location = /api/v1/shop/items {
        limit_req zone=carbonboo_login burst=20 nodelay;
        proxy_pass http://carbonboo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /api/v1/config {
        limit_req zone=carbonboo_login burst=20 nodelay;
        proxy_pass http://carbonboo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=300" always;
    }

    # ---------- 登录 / 注册 / 管理端登录：限流 ----------
    location ~ ^/api/v1/auth/(register|login)$ {
        limit_req zone=carbonboo_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://carbonboo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ~ ^/admin/(login|password)$ {
        limit_req zone=carbonboo_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://carbonboo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---------- 其余（同步 / 备份 / me / admin 页面） ----------
    location / {
        proxy_pass http://carbonboo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
