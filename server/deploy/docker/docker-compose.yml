# ============================================================================
# CarbonBoo · 容器部署（Docker Compose v2）
#
#   用途：在一台只有 IP、没有域名与 TLS 的云主机上把服务端跑起来。
#         需要域名 + 证书时，另加 certbot 侧车或改用宿主机 nginx（见 README §4）。
#
#   组件与端口（AGENTS §6：公网只开 SSH/80/443）：
#     nginx  : 80  → 宿主 0.0.0.0（唯一对外端口）
#     server : 8000 → 只在 compose 内网（不映射到宿主）
#     mysql  : 3306 → 只在 compose 内网（不映射到宿主，等价于 systemd 口径的"只监听 127.0.0.1"）
#
#   启动：docker compose -f deploy/docker/docker-compose.yml up -d --build
#   密钥：全部来自同目录 .env（600，不入库；模板见 .env.example）。compose 自动把它
#         用于 ${...} 插值，env_file 再把它注入 server 容器进程环境。
# ============================================================================
name: carbonboo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0（数据 + 建表/种子）
  #   * 首次启动（数据卷为空）时，docker-entrypoint 会按文件名顺序执行
  #     /docker-entrypoint-initdb.d/*.sql  →  schema.sql（21 张表）→ seed.sql（静态字典）
  #   * 两者都是幂等的；已初始化过的数据卷**不会**再跑一遍。改结构请用 sql/migrations/。
  #   * 内存按 2 vCPU / 2 GB 小机调过：buffer pool 256M、关 performance_schema、连接数 30
  #     （30 与 AGENTS §7.2 的「pool_size=5 + max_overflow=5 × workers 2 = 20 < 30」配套）。
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: carbonboo-mysql
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/docker/.env 缺少 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: carbonboo
      MYSQL_USER: ${MYSQL_USER:-carbonboo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?deploy/docker/.env 缺少 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=30
      - --skip-name-resolve
      - --innodb-flush-log-at-trx-commit=1
    volumes:
      - mysql_data:/var/lib/mysql
      # 建表 + 种子（只读挂载；仅在数据卷为空时被 entrypoint 执行一次）
      # 路径基准是**本 compose 文件所在目录**（server/deploy/docker/），故要退两级到 server/sql
      - ../../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ 是 compose 的转义：容器内看到的是 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------------
  # FastAPI 服务端（uvicorn --workers 2）
  #   * 不映射端口：只有 nginx 能连
  #   * 上传的商城图标落在命名卷 admin_uploads（容器重建不丢）
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: carbonboo-server:CF-2026.2
    container_name: carbonboo-server
    restart: unless-stopped
    mem_limit: 640m
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - admin_uploads:/app/admin_web/static/uploads
    expose:
      - "8000"

  # ---------------------------------------------------------------------------
  # nginx（唯一对外入口；反代 /admin 登录限流与 8m 上传上限）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: carbonboo-nginx
    restart: unless-stopped
    mem_limit: 96m
    logging: *default-logging
    ports:
      - "80:80"
      # 有域名与证书后再打开（README §4）：
      # - "443:443"
    volumes:
      - ./nginx/carbonboo.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server

volumes:
  mysql_data:
    name: carbonboo-mysql-data
  admin_uploads:
    name: carbonboo-admin-uploads
