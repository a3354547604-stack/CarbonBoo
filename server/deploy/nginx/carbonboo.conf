# ============================================================================
# CarbonBoo · nginx 站点（TLS 终止 + 反代 + /admin 登录限流）
#
#   安装：install -m 644 deploy/nginx/carbonboo.conf /etc/nginx/conf.d/
#   证书：certbot --nginx -d api.example.com（域名待定：ADR-0001 唯一未决项④）
# 口径：公网只开 SSH/80/443；后端只监听 127.0.0.1:8000；/admin 需强口令 + 登录限流；
#       /docs 生产默认关闭（由 APP 配置 DOCS_ENABLED 控制，路演前临时开）。
# ============================================================================

# 登录类接口（账号 + 管理端）：每 IP 每分钟 20 次，突发 10
limit_req_zone $binary_remote_addr zone=carbonboo_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    # 只留 ACME 挑战，其余全部跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 同步 push 是全量快照（云端备份 `since=0`），放宽到 8m；再大就该分表传了
    client_max_body_size 8m;
    client_body_timeout 30s;

    access_log /var/log/nginx/carbonboo.access.log;
    error_log  /var/log/nginx/carbonboo.error.log;

    # ---------- 企业级探活（不带业务，供负载/监控） ----------
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ---------- 取价：无需令牌，可公开缓存 5 分钟（失败时客户端整份丢弃回落内置价） ----------
    location = /api/v1/shop/items {
        limit_req zone=carbonboo_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 登录/注册/注销/管理端登录：限流 ----------
    location ~ ^/api/v1/auth/(register|login)$ {
        limit_req zone=carbonboo_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/admin/(login|password)$ {
        limit_req zone=carbonboo_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 其余（同步 / 备份 / me / admin 页面） ----------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
